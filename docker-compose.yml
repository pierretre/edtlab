services:
  web:
    image: pierretre/edtlab:latest
    container_name: edtlab_web
    restart: always
    networks:
      - edtlab_network
    ports:
      - "127.0.0.1:4001:4321"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - NODE_ENV=production
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - LIST_INBOX=${LIST_INBOX}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDER_NAME=${SENDER_NAME}
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:4321/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  matomo-db:
    image: mariadb:10.11
    container_name: edtlab_matomo-db
    restart: always
    networks:
      - edtlab_network
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
      MYSQL_PASSWORD: ${MATOMO_DB_PASSWORD}
    volumes:
      - /var/www/matomo/db:/var/lib/mysql
    ports:
      - "127.0.0.1:4003:3306"
    command: --max-allowed-packet=64MB
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MATOMO_DB_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  matomo:
    image: matomo:latest
    container_name: edtlab_matomo
    restart: always
    networks:
      - edtlab_network
    env_file:
      - .env
    links:
      - matomo-db
    depends_on:
      matomo-db:
        condition: service_healthy
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
      MATOMO_DATABASE_DBNAME: matomo
      PHP_MEMORY_LIMIT: 512M
    volumes:
      - /var/www/edtlabfr/matomo/data:/var/www/html
      - /var/www/edtlabfr/matomo/config:/var/www/html/config
      - /var/www/edtlabfr/matomo/logs:/var/www/html/tmp
      - ./matomo-apache-config.conf:/etc/apache2/conf-enabled/matomo.conf:ro
    ports:
      - "127.0.0.1:4002:80"

networks:
  edtlab_network:
    driver: bridge
