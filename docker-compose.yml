services:
  statics:
    image: pierretre/edtlab:latest
    container_name: edtlab_statics
    restart: always
    network_mode: bridge
    ports:
      - "0.0.0.0:4001:80"
    env_file:
      - .env

  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    container_name: edtlab_api_php
    restart: always
    network_mode: bridge
    env_file:
      - .env
    ports:
      - "0.0.0.0:4004:8080"
    environment:
      - BREVO_API_KEY=${BREVO_API_KEY}
      - LIST_INBOX=${LIST_INBOX}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDER_NAME=${SENDER_NAME}
    profiles:
      - php

  api-node:
    build:
      context: ./src/api-node
      dockerfile: Dockerfile
    container_name: edtlab_api_node
    restart: always
    network_mode: bridge
    env_file:
      - .env
    ports:
      - "0.0.0.0:4004:8080"
    environment:
      - BREVO_API_KEY=${BREVO_API_KEY}
      - LIST_INBOX=${LIST_INBOX}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDER_NAME=${SENDER_NAME}
      - APP_ENV=${APP_ENV:-production}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  matomo-db:
    image: mariadb:10.11
    container_name: edtlab_matomo-db
    restart: always
    network_mode: bridge
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
      MYSQL_PASSWORD: ${MATOMO_DB_PASSWORD}
    volumes:
      - /var/www/matomo/db:/var/lib/mysql
    ports:
      - "0.0.0.0:4003:3306"
    command: --max-allowed-packet=64MB
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MATOMO_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  matomo:
    image: matomo:latest
    container_name: edtlab_matomo
    restart: always
    network_mode: bridge
    env_file:
      - .env
    links:
      - matomo-db
    depends_on:
      matomo-db:
        condition: service_healthy
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
      MATOMO_DATABASE_DBNAME: matomo
      PHP_MEMORY_LIMIT: 512M
    volumes:
      - /var/www/edtlabfr/matomo/data:/var/www/html
      - /var/www/edtlabfr/matomo/config:/var/www/html/config
      - /var/www/edtlabfr/matomo/logs:/var/www/html/tmp
      - ./matomo-apache-config.conf:/etc/apache2/conf-enabled/matomo.conf:ro
    ports:
      - "0.0.0.0:4002:80"
