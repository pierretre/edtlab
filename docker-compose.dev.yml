services:
  astro:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host

  # Matomo Database
  matomo-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
      MYSQL_PASSWORD: matomo
    volumes:
      - matomo-db-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  # Matomo Analytics
  matomo:
    image: matomo:4-apache
    depends_on:
      - matomo-db
    environment:
      # Database connection
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: matomo
      MATOMO_DATABASE_DBNAME: matomo
      # Auto-setup configuration
      MATOMO_GENERAL_SALT: dev_salt_change_in_production_12345678901234567890
      MATOMO_GENERAL_TRUSTED_HOSTS: "localhost,127.0.0.1"
      # Skip database setup if already configured
      MATOMO_SKIP_BOOTSTRAP: 0
    volumes:
      - matomo-data:/var/www/html
    ports:
      - "8080:80"


volumes:
  matomo-db-data:
  matomo-data: