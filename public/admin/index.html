<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <title>Content Manager - EDT Lab</title>
    
    <script>
        // Listen for OAuth callback messages BEFORE Decap CMS loads
        window.addEventListener('message', (event) => {
            console.log('[OAuth] Received message:', event.data);
            
            if (typeof event.data === 'string' && event.data.startsWith('authorization:github:success:')) {
                const jsonPart = event.data.substring('authorization:github:success:'.length);
                try {
                    const content = JSON.parse(jsonPart);
                    console.log('[OAuth] Storing token...');
                    
                    // Decap CMS expects this exact format
                    const authData = {
                        token: content.token,
                        provider: 'github'
                    };
                    
                    localStorage.setItem('netlify-cms-user', JSON.stringify(authData));
                    
                    console.log('[OAuth] Reloading...');
                    window.location.reload();
                } catch (e) {
                    console.error('[OAuth] Error:', e);
                }
            }
        }, false);
    </script>
</head>

<body>
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
</body>

</html>
