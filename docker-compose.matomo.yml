version: '3.8'

services:
  matomo-db:
    image: mysql:8.0
    container_name: matomo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-matomo_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-matomo}
      MYSQL_USER: ${MYSQL_USER:-matomo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-matomo_password}
    volumes:
      - matomo-db-data:/var/lib/mysql
    networks:
      - matomo-network
    command: --default-authentication-plugin=mysql_native_password

  matomo:
    image: matomo:5-apache
    container_name: matomo-app
    restart: unless-stopped
    depends_on:
      - matomo-db
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: ${MYSQL_USER:-matomo}
      MATOMO_DATABASE_PASSWORD: ${MYSQL_PASSWORD:-matomo_password}
      MATOMO_DATABASE_DBNAME: ${MYSQL_DATABASE:-matomo}
      # GDPR compliance settings
      MATOMO_GENERAL_FORCE_SSL: 1
      MATOMO_GENERAL_ASSUME_SECURE_PROTOCOL: 1
    volumes:
      - matomo-data:/var/www/html
      - ./matomo/config:/var/www/html/config:rw
      - ./matomo/logs:/var/www/html/tmp/logs:rw
    ports:
      - "8080:80"
    networks:
      - matomo-network

  # Optional: Nginx reverse proxy for SSL termination
  matomo-proxy:
    image: nginx:alpine
    container_name: matomo-nginx
    restart: unless-stopped
    depends_on:
      - matomo
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/matomo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - matomo-network

volumes:
  matomo-db-data:
    driver: local
  matomo-data:
    driver: local

networks:
  matomo-network:
    driver: bridge