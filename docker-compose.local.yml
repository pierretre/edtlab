# Docker Compose override for local development
# This file extends docker-compose.matomo.yml for local testing

version: '3.8'

services:
  matomo-db:
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: matomo_local
      MYSQL_USER: matomo_local
      MYSQL_PASSWORD: local_matomo_password
    ports:
      - "3306:3306"  # Expose MySQL port for debugging

  matomo:
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo_local
      MATOMO_DATABASE_PASSWORD: local_matomo_password
      MATOMO_DATABASE_DBNAME: matomo_local
      # Development settings
      MATOMO_GENERAL_FORCE_SSL: 0
      MATOMO_GENERAL_ASSUME_SECURE_PROTOCOL: 0
    ports:
      - "8080:80"  # Direct access without nginx for local testing
    volumes:
      - ./matomo/local-config:/var/www/html/config:rw
      - ./matomo/local-logs:/var/www/html/tmp/logs:rw

  # Disable nginx proxy for local development
  matomo-proxy:
    profiles:
      - production  # Only start in production profile