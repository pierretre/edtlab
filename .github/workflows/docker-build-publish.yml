name: "Docker: Build and Publish"

on:
  push:
    branches:
      - main

jobs:
  build_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Extract commit SHA
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "COMMIT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build . \
            --file Dockerfile.prod \
            --tag ${{ secrets.DOCKER_HUB_USERNAME }}/edtlab:latest \
            --tag ${{ secrets.DOCKER_HUB_USERNAME }}/edtlab:${{ env.COMMIT_SHA }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/edtlab:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/edtlab:${{ env.COMMIT_SHA }}
