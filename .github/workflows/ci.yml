name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run TypeScript check
      run: npm run check
      
    - name: Run unit tests
      run: npm run test
      
    - name: Run comprehensive validation
      run: ./scripts/validate-ci.sh
      
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/coverage-final.json
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  accessibility-test:
    name: Accessibility Testing
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
      
    - name: Run accessibility tests
      run: |
        # Kill any existing processes on port 4321
        pkill -f "astro preview" || true
        sleep 2
        
        # Start preview server in background
        npm run preview &
        PREVIEW_PID=$!
        
        # Wait for server to be ready
        timeout 30 bash -c 'until curl -f http://localhost:4321/ > /dev/null 2>&1; do sleep 1; done'
        
        # Run tests
        npx playwright test src/test/e2e/accessibility.spec.ts --config=playwright.ci.config.ts
        
        # Clean up
        kill $PREVIEW_PID || true
        
  link-verification:
    name: Link Verification Testing
    runs-on: ubuntu-latest
    needs: accessibility-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
      
    - name: Run link verification tests
      run: |
        # Kill any existing processes on port 4321
        pkill -f "astro preview" || true
        sleep 2
        
        # Start preview server in background
        npm run preview &
        PREVIEW_PID=$!
        
        # Wait for server to be ready
        timeout 30 bash -c 'until curl -f http://localhost:4321/ > /dev/null 2>&1; do sleep 1; done'
        
        # Run tests
        npx playwright test src/test/e2e/link-verification.spec.ts --config=playwright.ci.config.ts
        
        # Clean up
        kill $PREVIEW_PID || true
        
  route-validation:
    name: Route Validation
    runs-on: ubuntu-latest
    needs: link-verification
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Test route accessibility
      run: |
        # Kill any existing processes on port 4321
        pkill -f "astro preview" || true
        sleep 2
        
        # Start preview server in background
        npm run preview &
        PREVIEW_PID=$!
        
        # Wait for server to be ready
        timeout 30 bash -c 'until curl -f http://localhost:4321/ > /dev/null 2>&1; do sleep 1; done'
        
        # Run route tests using Playwright
        npx playwright test src/test/e2e/routes.spec.ts --config=playwright.ci.config.ts
        
        # Clean up
        kill $PREVIEW_PID || true

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [test, accessibility-test, link-verification, route-validation]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate test coverage report
      run: npm run test:coverage
      
    - name: Check coverage thresholds
      run: |
        # Basic coverage check - can be enhanced with specific thresholds
        if [ -f "coverage/coverage-summary.json" ]; then
          echo "Coverage report generated successfully"
          cat coverage/coverage-summary.json
        else
          echo "Warning: Coverage report not found"
        fi
        
    - name: Validate code quality
      run: |
        echo "Running code quality checks..."
        npm run check
        echo "Code quality validation completed"
