name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run TypeScript check
      run: npm run check
      
    - name: Run unit tests
      run: npm run test
      
    - name: Run comprehensive validation
      run: ./scripts/validate-ci.sh
      
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/coverage-final.json
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  accessibility-test:
    name: Accessibility Testing
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
      
    - name: Run accessibility tests
      run: |
        npm run preview &
        sleep 5
        npx playwright test --config=playwright.config.ts
        
  route-validation:
    name: Route Validation
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Start preview server
      run: |
        npm run preview &
        sleep 5
        
    - name: Test route accessibility
      run: |
        # Wait for server to be ready
        timeout 30 bash -c 'until curl -f http://localhost:4321/ > /dev/null 2>&1; do sleep 1; done'
        
        # Test main routes are accessible
        echo "Testing main routes..."
        curl -f http://localhost:4321/ || exit 1
        curl -f http://localhost:4321/en/ || exit 1
        curl -f http://localhost:4321/fr/ || exit 1
        
        # Test main content pages
        routes=(
          "en/program" "fr/program"
          "en/focused-projects" "fr/focused-projects"
          "en/production" "fr/production"
          "en/demo-center" "fr/demo-center"
          "en/resources" "fr/resources"
          "en/news" "fr/news"
          "en/join-us" "fr/join-us"
          "en/contact" "fr/contact"
          "en/about" "fr/about"
        )
        
        failed_routes=0
        for route in "${routes[@]}"; do
          echo "Testing route: /$route"
          if curl -f "http://localhost:4321/$route" > /dev/null 2>&1; then
            echo "✅ Route /$route is accessible"
          else
            echo "⚠️  Route /$route not accessible (may not be implemented yet)"
            ((failed_routes++))
          fi
        done
        
        echo "Route validation completed. $failed_routes routes not accessible."
        
        # Don't fail the build for missing routes during development
        if [ $failed_routes -gt 8 ]; then
          echo "Too many routes failing - this might indicate a serious issue"
          exit 1
        fi

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [test, accessibility-test, route-validation]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate test coverage report
      run: npm run test:coverage
      
    - name: Check coverage thresholds
      run: |
        # Basic coverage check - can be enhanced with specific thresholds
        if [ -f "coverage/coverage-summary.json" ]; then
          echo "Coverage report generated successfully"
          cat coverage/coverage-summary.json
        else
          echo "Warning: Coverage report not found"
        fi
        
    - name: Validate code quality
      run: |
        echo "Running code quality checks..."
        npm run check
        echo "Code quality validation completed"

  deployment-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [test, accessibility-test, route-validation]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build for production
      run: npm run build
      
    - name: Validate production build
      run: |
        echo "Validating production build..."
        
        # Check if build directory exists and contains expected files
        if [ ! -d "dist" ]; then
          echo "Error: Build directory not found"
          exit 1
        fi
        
        # Check for essential files
        essential_files=("index.html" "404.html")
        for file in "${essential_files[@]}"; do
          if [ ! -f "dist/$file" ]; then
            echo "Warning: $file not found in build output"
          fi
        done
        
        # Check build size (basic check)
        build_size=$(du -sh dist | cut -f1)
        echo "Build size: $build_size"
        
        echo "Production build validation completed"
        
    - name: Deployment status
      run: |
        echo "✅ All checks passed - Ready for deployment"
        echo "Build artifacts are available in the dist/ directory"