name: Notify publishers by label

on:
  pull_request:
    types: [labeled, opened, synchronize]
    
permissions:
  pull-requests: write
  issues: write
  
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify specific users if label matches
        uses: actions/github-script@v7
        with:
          script: |
            const labelToUsers = {
              "decap-cms/pending_publish": ["pierretre"]
            };

            const pr = context.payload.pull_request;
            const labels = pr.labels.map(l => l.name);

            const usersToNotify = new Set();

            for (const label of labels) {
              if (labelToUsers[label]) {
                labelToUsers[label].forEach(u => usersToNotify.add(u));
              }
            }

            if (usersToNotify.size > 0) {
              const mentions = [...usersToNotify].map(u => `@${u}`).join(" ");
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body: `${mentions} — new changes are ready for publishing. Merge the current PR or go to https://edtlab.fr/admin#/workflow to publish these changes.`
              });
            }
