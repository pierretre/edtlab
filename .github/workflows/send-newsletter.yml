name: Send Newsletter

on:
  push:
    branches:
      - main

jobs:
  send_newsletter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Detect added or modified newsletter files
        id: changes
        shell: bash
        run: |
          # Get all added or modified newsletter files in the push compared to main
          # using ... for multi-commit merge-safe diff
          ADDED_FILES=$(git diff --name-only --diff-filter=AM origin/main...HEAD \
            | grep '^src/content/newsletter/.*\.md$' || true)

          # fallback: first push or no diff
          if [ -z "$ADDED_FILES" ]; then
            ADDED_FILES=$(git ls-files 'src/content/newsletter/*.md' || true)
          fi

          # Normalize filenames: replace fancy dashes with simple ones
          SAFE_FILES=$(echo "$ADDED_FILES" | tr '–—' '--')

          # Save safe file list to GitHub output, safely handling special chars
          echo "added<<EOF" >> $GITHUB_OUTPUT
          echo "$SAFE_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Stop if no new newsletter
        if: steps.changes.outputs.added == ''
        run: |
          echo "No new newsletter file added."
          exit 0

      - name: Send newsletter
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          BREVO_EXTERNAL_LIST_ID: ${{ secrets.BREVO_EXTERNAL_LIST_ID }}
          BREVO_INTERNAL_LIST_ID: ${{ secrets.BREVO_INTERNAL_LIST_ID }}
          NEWSLETTER_FILE: ${{ steps.changes.outputs.added }}
        run: |
          # if multiple files, send them one by one
          for FILE in $NEWSLETTER_FILE; do
            echo "Sending newsletter: $FILE"
            npx tsx src/emails/send-newsletter.ts "$FILE"
          done
