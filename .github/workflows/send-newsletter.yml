name: Send Newsletter

on:
  push:
    branches:
      - main

jobs:
  send_newsletter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Detect added newsletter files
        id: changes
        run: |
          # Get all added or modified newsletter files in the push
          ADDED_FILES=$(git diff --name-only --diff-filter=AM origin/main...HEAD | grep '^src/content/newsletter/.*\.md$' || true)
          
          # fallback if no diff found (e.g., first push)
          if [ -z "$ADDED_FILES" ]; then
            ADDED_FILES=$(git ls-files 'src/content/newsletter/*.md' || true)
          fi
      
          # Set GitHub output safely
          echo "added<<EOF" >> $GITHUB_OUTPUT
          echo "$ADDED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Stop if no new newsletter
        if: steps.changes.outputs.added == ''
        run: |
          echo "No new newsletter file added."
          exit 0

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - run: npm ci

      - name: Send newsletter
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          BREVO_EXTERNAL_LIST_ID: ${{ secrets.BREVO_EXTERNAL_LIST_ID }}
          BREVO_INTERNAL_LIST_ID: ${{ secrets.BREVO_INTERNAL_LIST_ID }}
          NEWSLETTER_FILE: ${{ steps.changes.outputs.added }}
        run: npx tsx src/emails/send-newsletter.ts
