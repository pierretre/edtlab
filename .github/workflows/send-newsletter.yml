name: Send Newsletter

on:
  push:
    branches:
      - main

jobs:
  send_newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history required)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # important for correct diff

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Detect NEW newsletter files (added only)
        id: changes
        shell: bash
        run: |
          echo "==== DEBUG: Git context ===="
          echo "Before SHA: ${{ github.event.before }}"
          echo "Current SHA: ${{ github.sha }}"
          echo "============================"

          # Detect only ADDED files compared to previous main state
          ADDED_FILES=$(git diff --name-only --diff-filter=A \
            ${{ github.event.before }} ${{ github.sha }} \
            | grep '^src/content/newsletter/.*\.md$' || true)

          echo ""
          echo "==== DEBUG: Raw detected files ===="
          echo "$ADDED_FILES"
          echo "==================================="

          if [ -z "$ADDED_FILES" ]; then
            echo "No new newsletter markdown files detected."
          else
            echo ""
            echo "==== DEBUG: File content preview ===="
            while IFS= read -r FILE; do
              echo ""
              echo "----- $FILE -----"
              echo ""
              head -n 40 "$FILE" || echo "Could not read file."
              echo ""
            done <<< "$ADDED_FILES"
            echo "====================================="
          fi

          # Safely pass output to next step (multi-line safe)
          echo "added<<EOF" >> $GITHUB_OUTPUT
          echo "$ADDED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Stop if no new newsletter
        if: steps.changes.outputs.added == ''
        run: |
          echo "Stopping workflow — no new newsletter to send."
          exit 0

      - name: Send newsletter(s)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          BREVO_EXTERNAL_LIST_ID: ${{ secrets.BREVO_EXTERNAL_LIST_ID }}
          BREVO_INTERNAL_LIST_ID: ${{ secrets.BREVO_INTERNAL_LIST_ID }}
        run: |
          echo ""
          echo "==== Sending newsletters ===="

          while IFS= read -r FILE; do
            echo "Sending newsletter for file: $FILE"
            npx tsx src/emails/send-newsletter.ts "$FILE"
          done <<< "${{ steps.changes.outputs.added }}"

          echo "==== Done ===="
